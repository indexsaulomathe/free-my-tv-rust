[workspace]
resolver = "2"
members = ["crates/freemytv-core", "crates/freemytv-cli", "crates/freemytv-logic"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# The WebAssembly the TV downloads: small over fast.
[profile.release.package.freemytv-logic]
opt-level = "s"
