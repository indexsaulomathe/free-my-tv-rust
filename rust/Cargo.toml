[workspace]
resolver = "2"
members = ["crates/freemytv-core", "crates/freemytv-cli", "crates/freemytv-art"]
# freemytv-art needs FreeType and HarfBuzz: built only when asked (-p freemytv-art, or --features freemytv-cli/art).
default-members = ["crates/freemytv-core", "crates/freemytv-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
lto = true
codegen-units = 1
strip = true
