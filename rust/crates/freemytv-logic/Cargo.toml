[package]
name = "freemytv-logic"
description = "The web app's pure logic (web/data.js, web/strings.js) in Rust, compiled to WebAssembly for the TV"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = { version = "1.0", features = ["preserve_order"] }
