[package]
name = "freemytv-art"
description = "tools/make_art.py and tools/make_symbols.py in Rust: Pillow's own drawing, blur, resize and compositing, and its text through the same FreeType and HarfBuzz, so the pixels come out the same"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
freetype-sys = "0.23"

[build-dependencies]
pkg-config = "0.3"
